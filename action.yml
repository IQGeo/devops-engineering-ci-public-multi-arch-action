name: 'Build Multi Arch manifest'
description: 'Composite Action to build multi arch manifest from amd64 & arm64 images and push to Azure and Harbor registries'

inputs:
  version:
    description: 'Version to build'
    required: true
    type: string
  updated_tags:
    description: 'Comma-seperated list of new tags to retag the multi arch image'
    required: true
    type: string
  amd_tag:
    description: 'Tag used to identify the amd image built for this composite action run to include in the multi arch image manifest (Build ID)'
    required: true
    type: string
  arm_tag:
    description: 'Tag used to identify the arm image built for this composite action run to include in the multi arch image manifest (Build ID)'
    required: true
    type: string
  module:
    description: 'Module to build (product, devdb, editions)'
    required: true
    type: string 
  release_modules:
    description: 'Comma-separated list of modules to include in release repostitories'
    required: false
    type: string
    default: ''  # An empty string means no modules are included in release repositories
  acr:
    description: 'IQGeos Azure container registry server name'
    required: true
    type: string
  registry_username:
    description: 'IQGeos Azure container registry username for logging into Azure'
    required: true
    type: string
  registry_password:
    description: 'IQGeos Azure container registry password for logging into Azure'
    required: true
    type: string
  harbor:
    description: 'IQGeos Harbor container registry server name'
    required: true
    type: string
  harbor_cli_secret:
    description: 'IQGeos Harbor container registry password for logging into Azure'
    required: true
    type: string
  harbor_username:
    description: 'IQGeos Harbor container registry username for logging into Azure'
    required: true
    type: string
  engineering_prefix:
    description: 'Engineering prefix to place multi arch images in ACR & Harbor'
    type: string
    default: devops_sandbox_engineering
  releases_prefix:
    description: 'Releases prefix to place multi arch images in ACR & Harbor'
    type: string
    default: devops_sandbox_releases
  is_release:
    description: 'Whether this is a pre-release or release version'
    type: string

runs:
    using: "composite"
    steps:
      - name: login to acr
        shell: bash
        run: |
          docker login -u $REGISTRY_USERNAME -p $REGISTRY_PASWORD $ACR
        env:
          ACR: ${{ inputs.acr }}
          REGISTRY_USERNAME: ${{ inputs.registry_username }}
          REGISTRY_PASWORD: ${{ inputs.registry_password}}  

      - name: login to harbor
        shell: bash
        continue-on-error: true
        run: |
          docker login -u $HARBOR_USERNAME -p $HARBOR_CLI_SECRET $HARBOR
        env:
          HARBOR_CLI_SECRET: ${{ inputs.harbor_cli_secret }}
          HARBOR_USERNAME: ${{ inputs.harbor_username }}
          HARBOR: ${{ inputs.harbor }}        
          
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Install Cosign
        uses: sigstore/cosign-installer@v3

      - name: Install oras
        uses: oras-project/setup-oras@v1

      - name: Create Version manifest and push to Azure ACR
        id: manifest
        shell: bash
        run: |
            docker buildx imagetools create \
              --tag $ACR/$ENGINEERING_PREFIX/$MODULE:$VERSION \
              $ACR/$ENGINEERING_PREFIX/$MODULE:$AMD_TAG \
              $ACR/$ENGINEERING_PREFIX/$MODULE:$ARM_TAG
            DIGEST=$(docker buildx imagetools inspect $ACR/$ENGINEERING_PREFIX/$MODULE:$VERSION --format '{{json .Manifest}}' | jq -r '.digest')
            echo "digest=$DIGEST" >> $GITHUB_OUTPUT
        env:
          VERSION: ${{ inputs.version }}
          AMD_TAG: ${{ inputs.amd_tag }}
          ARM_TAG: ${{ inputs.arm_tag }}
          MODULE: ${{ inputs.module }}
          ACR: ${{ inputs.acr }}
          HARBOR: ${{ inputs.harbor }}
          ENGINEERING_PREFIX: ${{ inputs.engineering_prefix }}

      - name: Push to Harbor Engineering          
        shell: bash
        continue-on-error: true        
        run: |
            SOURCE_IMAGE=$ACR/$ENGINEERING_PREFIX/$MODULE:$VERSION
            TARGET_IMAGE=$HARBOR/$ENGINEERING_PREFIX/$MODULE:$VERSION
            docker buildx imagetools create --tag $TARGET_IMAGE $SOURCE_IMAGE
        env:
          VERSION: ${{ inputs.version }}
          AMD_TAG: ${{ inputs.amd_tag }}
          ARM_TAG: ${{ inputs.arm_tag }}
          MODULE: ${{ inputs.module }}
          ACR: ${{ inputs.acr }}
          HARBOR: ${{ inputs.harbor }}
          ENGINEERING_PREFIX: ${{ inputs.engineering_prefix }}
          
      - name: Retag Multi-Arch image for ACR engineering
        shell: bash
        run: |
          IFS=',' read -ra TAGS <<< $NEW_TAGS 
          SOURCE_IMAGE=$ACR/$ENGINEERING_PREFIX/$MODULE:$VERSION
          for tag in "${TAGS[@]}"; do
            TARGET_IMAGE=$ACR/$ENGINEERING_PREFIX/$MODULE:$tag
            echo "Retagging $SOURCE_IMAGE -> $TARGET_IMAGE"
            docker buildx imagetools create --tag $TARGET_IMAGE $SOURCE_IMAGE
          done
        env:
          VERSION: ${{ inputs.version }}
          MODULE: ${{ inputs.module }}
          ACR: ${{ inputs.acr }}
          NEW_TAGS: ${{ inputs.updated_tags }}
          ENGINEERING_PREFIX: ${{ inputs.engineering_prefix }}

      - name: Retag Multi-Arch image for Harbor engineering
        shell: bash
        continue-on-error: true        
        run: |
          IFS=',' read -ra TAGS <<< $NEW_TAGS 
          SOURCE_IMAGE=$ACR/$ENGINEERING_PREFIX/$MODULE:$VERSION
          for tag in "${TAGS[@]}"; do
            TARGET_IMAGE=$HARBOR/$ENGINEERING_PREFIX/$MODULE:$tag
            echo "Retagging $SOURCE_IMAGE -> $TARGET_IMAGE"
            docker buildx imagetools create --tag $TARGET_IMAGE $SOURCE_IMAGE
          done
        env:
          VERSION: ${{ inputs.version }}
          MODULE: ${{ inputs.module }}
          ACR: ${{ inputs.acr }}
          HARBOR: ${{ inputs.harbor }}
          NEW_TAGS: ${{ inputs.updated_tags }}
          ENGINEERING_PREFIX: ${{ inputs.engineering_prefix }}

      - name: Retag Multi-Arch image for ACR releases
        shell: bash
        if: ${{ inputs.is_release == 'true' && contains(inputs.release_modules, inputs.module) }}
        run: |
          IFS=',' read -ra TAGS <<< $NEW_TAGS 
          SOURCE_IMAGE=$ACR/$ENGINEERING_PREFIX/$MODULE:$VERSION
          for tag in "${TAGS[@]}"; do
            TARGET_IMAGE=$ACR/$RELEASES_PREFIX/$MODULE:$tag
            echo "Retagging $SOURCE_IMAGE -> $TARGET_IMAGE"
            docker buildx imagetools create --tag $TARGET_IMAGE $SOURCE_IMAGE
          done
        env:
          VERSION: ${{ inputs.version }}
          MODULE: ${{ inputs.module }}
          ACR: ${{ inputs.acr }}
          NEW_TAGS: ${{ inputs.updated_tags }}
          ENGINEERING_PREFIX: ${{ inputs.engineering_prefix }}
          RELEASES_PREFIX: ${{ inputs.releases_prefix }}

      - name: Retag Multi-Arch image for Harbor releases
        shell: bash
        continue-on-error: true        
        if: ${{ inputs.is_release == 'true' && contains(inputs.release_modules, inputs.module) }}
        run: |
          IFS=',' read -ra TAGS <<< $NEW_TAGS 
          SOURCE_IMAGE=$ACR/$ENGINEERING_PREFIX/$MODULE:$VERSION
          for tag in "${TAGS[@]}"; do
            TARGET_IMAGE=$HARBOR/$RELEASES_PREFIX/$MODULE:$tag
            echo "Retagging $SOURCE_IMAGE -> $TARGET_IMAGE"
            docker buildx imagetools create --tag $TARGET_IMAGE $SOURCE_IMAGE
          done
        env:
          VERSION: ${{ inputs.version }}
          MODULE: ${{ inputs.module }}
          ACR: ${{ inputs.acr }}
          HARBOR: ${{ inputs.harbor }}
          NEW_TAGS: ${{ inputs.updated_tags }}
          ENGINEERING_PREFIX: ${{ inputs.engineering_prefix }}
          RELEASES_PREFIX: ${{ inputs.releases_prefix }}

      # `imagetools create` copies the image index only. Cosign signatures and ORAS
      # referrers live in the repository they were pushed to, so every ACR/Harbor
      # copy has to be signed and have the SBOM attached individually.
      - name: Sign and attach SBOM in every registry repository
        shell: bash
        env:
          DIGEST: ${{ steps.manifest.outputs.digest }}
          VERSION: ${{ inputs.version }}
          MODULE: ${{ inputs.module }}
          ACR: ${{ inputs.acr }}
          HARBOR: ${{ inputs.harbor }}
          NEW_TAGS: ${{ inputs.updated_tags }}
          ENGINEERING_PREFIX: ${{ inputs.engineering_prefix }}
          RELEASES_PREFIX: ${{ inputs.releases_prefix }}
          IS_RELEASE_TARGET: ${{ inputs.is_release == 'true' && contains(inputs.release_modules, inputs.module) }}
        run: |
          set -uo pipefail

          IFS=',' read -ra TAGS <<< "$NEW_TAGS"
          RELEASE_TAG="${TAGS[0]:-$VERSION}"

          # repo|tag pairs: the releases repos never carry the raw :$VERSION tag.
          TARGETS=(
            "$ACR/$ENGINEERING_PREFIX/$MODULE|$VERSION"
            "$HARBOR/$ENGINEERING_PREFIX/$MODULE|$VERSION"
          )
          if [ "$IS_RELEASE_TARGET" = "true" ]; then
            TARGETS+=(
              "$ACR/$RELEASES_PREFIX/$MODULE|$RELEASE_TAG"
              "$HARBOR/$RELEASES_PREFIX/$MODULE|$RELEASE_TAG"
            )
          fi

          # BuildKit stores the SBOM as an in-index attestation. Export it once so the
          # same documents can be attached as referrers to each copy.
          mkdir -p sboms
          docker buildx imagetools inspect "$ACR/$ENGINEERING_PREFIX/$MODULE@$DIGEST" \
            --format '{{json .SBOM}}' > sbom-raw.json
          if jq -e 'has("SPDX")' sbom-raw.json > /dev/null 2>&1; then
            jq '.SPDX' sbom-raw.json > sboms/image.spdx.json
          else
            for plat in $(jq -r 'keys[]' sbom-raw.json); do
              jq --arg p "$plat" '.[$p].SPDX' sbom-raw.json > "sboms/${plat//\//-}.spdx.json"
            done
          fi

          SBOM_ARGS=()
          for f in sboms/*.spdx.json; do
            [ -s "$f" ] || continue
            SBOM_ARGS+=("$f:application/spdx+json")
          done
          if [ ${#SBOM_ARGS[@]} -eq 0 ]; then
            echo "::error::No SBOM found on $ACR/$ENGINEERING_PREFIX/$MODULE@$DIGEST"
            exit 1
          fi

          failed_primary=0
          for target in "${TARGETS[@]}"; do
            repo="${target%%|*}"
            tag="${target##*|}"

            # imagetools create may re-serialise the index, so resolve each copy's own digest.
            digest=$(docker buildx imagetools inspect "$repo:$tag" --format '{{json .Manifest}}' 2>/dev/null | jq -r '.digest')
            if [ -z "$digest" ] || [ "$digest" = "null" ]; then
              echo "::warning::Skipping $repo:$tag - not present in registry"
              [ "$repo" = "$ACR/$ENGINEERING_PREFIX/$MODULE" ] && failed_primary=1
              continue
            fi

            echo "Signing and attaching SBOM to $repo@$digest"
            if cosign sign --yes "$repo@$digest" &&
               oras attach --artifact-type application/spdx+json "$repo@$digest" "${SBOM_ARGS[@]}"; then
              continue
            fi

            echo "::warning::Failed to sign or attach SBOM for $repo@$digest"
            [ "$repo" = "$ACR/$ENGINEERING_PREFIX/$MODULE" ] && failed_primary=1
          done

          exit $failed_primary
